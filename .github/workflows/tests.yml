name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - run: python -m pip install '.[dev]'
      - run: pytest -q
      - run: worship-beats doctor
      - run: python -m pip install build && python -m build
      - run: python scripts/make_demo_project.py --out jobs/ci-fixture
      - run: worship-beats export jobs/ci-fixture/project.json --draft
      - run: worship-beats prepare jobs/ci-fixture/stems/drums.wav --already-drums --job jobs/ci-analysis --bpm 120 --pulses 4
      - run: worship-beats export jobs/ci-analysis/project.json --draft
  local-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - run: python -m pip install '.[app,dev]'
      - run: pytest tests/test_app.py -q
